<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage teacher records.">
    <title>Teachers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/teacher.css">
</head>
<body>
    <div class="page-layout">
        <main class="main-content">
            <header class="topbar">
                <h1>ABC Public School</h1>
                <div class="topbar-actions">
                    <button class="notification-btn" id="notificationBtn" title="Notifications">♧<span class="notification-dot"></span></button>
                    <div class="top-profile">
                        <div class="profile-avatar">AS</div>
                        <div class="top-profile-info"><strong>Admin</strong><span>Administrator</span></div>
                    </div>
                </div>
            </header>

            <div class="teacher-content">
                <div class="teacher-header">
                    <div class="page-title">
                        <h2>Teachers</h2>
                        <p>Manage all teachers in the school</p>
                    </div>
                    <button type="button" id="addTeacherBtn" class="add-teacher-btn">+ Add Teacher</button>
                </div>

                <div class="teacher-toolbar teacher-toolbar-filters">
                    <div class="teacher-search">
                        <span class="search-icon" aria-hidden="true">⌕</span>
                        <input type="search" id="teacherSearch" placeholder="Search by name, ID, phone, or post..." aria-label="Search teachers">
                    </div>
                    <label class="teacher-filter">
                        <span>Post</span>
                        <select id="postFilter"><option value="">All posts</option></select>
                    </label>
                    <button type="button" id="clearTeacherFilters" class="clear-filters-btn">Clear filters</button>
                </div>

                <section class="teacher-list-section">
                    <div class="teacher-table-wrapper">
                        <table class="teacher-table">
                            <thead><tr><th>Teacher ID</th><th>Name</th><th>Phone</th><th>Post</th><th>Action</th></tr></thead>
                            <tbody id="teacherTableBody"><tr><td colspan="5">Loading teachers...</td></tr></tbody>
                        </table>
                    </div>
                    <p class="teacher-result-count" id="teacherResultCount" aria-live="polite"></p>
                </section>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/teacher.js"></script>
</body>
</html>
