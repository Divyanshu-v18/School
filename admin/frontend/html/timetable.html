<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create and manage weekly timetable slots for classes.">

    <title>Timetable</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/timetable.css">
</head>

<body>

    <div class="page-layout">

        <!-- ========================================
             SIDEBAR
        ========================================= -->
<!-- ========================================
             MAIN CONTENT
        ========================================= -->
        <main class="main-content">

            <!-- NAVBAR -->
            <header class="topbar">

                <h1>ABC Public School</h1>

                <div class="topbar-actions">

                    <button
                        class="notification-btn"
                        id="notificationBtn"
                        title="Notifications">
                        ♧
                        <span class="notification-dot"></span>
                    </button>

                    <div class="top-profile">
                        <div class="profile-avatar">AS</div>

                        <div class="top-profile-info">
                            <strong>Admin</strong>
                            <span>Administrator</span>
                        </div>
                    </div>

                </div>

            </header>


            <!-- Timetable CONTENT -->
            <section class="timetable-content">

                <!-- HEADER -->
                <div class="timetable-header">
                    <div class="page-title">
                        <h2>Class Timetable</h2>
                        <p>View and manage weekly lecture schedules, teachers, and period timings.</p>
                    </div>

                    <button class="add-slot-btn" id="openAddSlotBtn">
                        + Add Period Slot
                    </button>
                </div>

                <!-- FILTER CONTROLS -->
                <div class="timetable-filter-bar">
                    <div class="filter-group">
                        <label for="ttClass">Class</label>
                        <select id="ttClass">
                            <option value="10">Class 10</option>
                            <option value="11">Class 11</option>
                            <option value="12">Class 12</option>
                            <option value="9">Class 9</option>
                            <option value="8">Class 8</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="ttSection">Section</label>
                        <select id="ttSection">
                            <option value="A">Section A</option>
                            <option value="B">Section B</option>
                            <option value="C">Section C</option>
                            <option value="D">Section D</option>
                        </select>
                    </div>

                    <button class="btn-refresh-tt" id="refreshTtBtn">View Schedule</button>
                </div>

                <!-- TIMETABLE TABLE -->
                <div class="timetable-table-wrap">
                    <table class="timetable-table">
                        <thead>
                            <tr>
                                <th style="width: 130px;">Day</th>
                                <th style="width: 90px;">Period</th>
                                <th style="width: 140px;">Time</th>
                                <th>Subject</th>
                                <th>Teacher</th>
                                <th style="width: 100px;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="timetableBody">
                            <tr>
                                <td colspan="6" class="table-loading">Loading schedule...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- MODAL: ADD SLOT -->
                <div class="modal-overlay" id="addSlotModal" style="display: none;">
                    <div class="modal-card">
                        <div class="modal-header">
                            <h3>Add Period Slot</h3>
                            <button class="modal-close-btn" id="closeAddSlotBtn">&times;</button>
                        </div>
                        <form id="addSlotForm">
                            <div class="form-row">
                                <div class="form-group flex-1">
                                    <label for="slotClass">Class *</label>
                                    <select id="slotClass" required>
                                        <option value="10">Class 10</option>
                                        <option value="11">Class 11</option>
                                        <option value="12">Class 12</option>
                                        <option value="9">Class 9</option>
                                        <option value="8">Class 8</option>
                                    </select>
                                </div>
                                <div class="form-group flex-1">
                                    <label for="slotSection">Section *</label>
                                    <select id="slotSection" required>
                                        <option value="A">Section A</option>
                                        <option value="B">Section B</option>
                                        <option value="C">Section C</option>
                                        <option value="D">Section D</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group flex-1">
                                    <label for="slotDay">Day of Week *</label>
                                    <select id="slotDay" required>
                                        <option value="Monday">Monday</option>
                                        <option value="Tuesday">Tuesday</option>
                                        <option value="Wednesday">Wednesday</option>
                                        <option value="Thursday">Thursday</option>
                                        <option value="Friday">Friday</option>
                                        <option value="Saturday">Saturday</option>
                                    </select>
                                </div>
                                <div class="form-group flex-1">
                                    <label for="slotPeriod">Period Number *</label>
                                    <input type="number" id="slotPeriod" min="1" max="10" required value="1">
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="slotSubject">Subject *</label>
                                <input type="text" id="slotSubject" required placeholder="e.g. Mathematics">
                            </div>

                            <div class="form-group">
                                <label for="slotTeacher">Teacher Name</label>
                                <input type="text" id="slotTeacher" placeholder="e.g. Rahul Sharma">
                            </div>

                            <div class="form-row">
                                <div class="form-group flex-1">
                                    <label for="slotStart">Start Time *</label>
                                    <input type="time" id="slotStart" required value="08:30">
                                </div>
                                <div class="form-group flex-1">
                                    <label for="slotEnd">End Time *</label>
                                    <input type="time" id="slotEnd" required value="09:15">
                                </div>
                            </div>

                            <div class="modal-actions">
                                <button type="button" class="btn-cancel" id="cancelAddSlotBtn">Cancel</button>
                                <button type="submit" class="btn-save">Save Slot</button>
                            </div>
                        </form>
                    </div>
                </div>

            </section>

        </main>

    </div>

    <script src="../js/sidebar.js"></script>
    <script src="../js/feature-toggle.js"></script>

    <script src="../js/api.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/timetable.js"></script>

</body>
</html>
