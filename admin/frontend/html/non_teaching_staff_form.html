
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Non-Teaching Staff Registration</title>

    <link rel="stylesheet" href="../css/non_teaching_staff_form.css">
</head>

<body>

<div class="registration-container">

    <div class="page-header">
        <div>
            <h2>Non-Teaching Staff Registration</h2>
            <p>Register a new non-teaching staff member</p>
        </div>

        <a href="non_teaching_staff.html" class="back-btn">
            ← Back
        </a>
    </div>

    <form id="staffForm">

        <!-- PERSONAL INFORMATION -->

        <section class="form-section">

            <div class="section-heading">
                <div class="section-icon">01</div>
                <div>
                    <h3>Personal Information</h3>
                    <p>Enter the staff member's personal details</p>
                </div>
            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label>Full Name <span>*</span></label>
                    <input type="text" name="full_name"
                           placeholder="Enter full name" required>
                </div>

                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="text" name="dob"
                           class="date-input"
                           placeholder="DD-MM-YYYY"
                           maxlength="10"
                           inputmode="numeric"
                           autocomplete="off">
                </div>

                <div class="form-group">
                    <label>Gender <span>*</span></label>
                    <select name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Mobile Number <span>*</span></label>
                    <input type="tel" name="phone"
                           placeholder="Enter 10-digit mobile number"
                           pattern="[6-9][0-9]{9}"
                           maxlength="10" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email"
                           placeholder="Enter email address">
                </div>

                <div class="form-group">
                    <label>Blood Group</label>
                    <select name="blood_group">
                        <option value="">Select Blood Group</option>
                        <option>A+</option>
                        <option>A-</option>
                        <option>B+</option>
                        <option>B-</option>
                        <option>AB+</option>
                        <option>AB-</option>
                        <option>O+</option>
                        <option>O-</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label>Residential Address</label>
                    <textarea name="address" rows="3"
                              placeholder="Enter complete residential address"></textarea>
                </div>

            </div>
        </section>


        <!-- EMPLOYMENT INFORMATION -->

        <section class="form-section">

            <div class="section-heading">
                <div class="section-icon">02</div>
                <div>
                    <h3>Employment Information</h3>
                    <p>Enter job role and employment details</p>
                </div>
            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label>Job Role / Designation <span>*</span></label>

                    <select name="designation" id="designation" required>
                        <option value="">Select Job Role</option>

                        <optgroup label="Administration & Office">
                            <option>Office Manager</option>
                            <option>Office Assistant</option>
                            <option>Receptionist</option>
                            <option>Clerk</option>
                            <option>Peon</option>
                            <option>Fee Counter Staff</option>
                            <option>Data Entry Operator</option>
                            <option>Record Keeper</option>
                            <option>HR Assistant</option>
                        </optgroup>

                        <optgroup label="Transport">
                            <option>Driver</option>
                            <option>Bus Conductor</option>
                            <option>Transport Coordinator</option>
                            <option>Bus Attendant</option>
                            <option>Vehicle Cleaner</option>
                        </optgroup>

                        <optgroup label="Finance & Accounts">
                            <option>Accountant</option>
                            <option>Accounts Assistant</option>
                            <option>Cashier</option>
                            <option>Fee Collection Staff</option>
                            <option>Billing Assistant</option>
                        </optgroup>

                        <optgroup label="Library">
                            <option>Librarian</option>
                            <option>Library Assistant</option>
                            <option>Library Attendant</option>
                        </optgroup>

                        <optgroup label="Laboratory">
                            <option>Lab Assistant</option>
                            <option>Lab Attendant</option>
                            <option>Lab Technician</option>
                            <option>Computer Lab Assistant</option>
                        </optgroup>

                        <optgroup label="Support & Maintenance">
                            <option>Maid</option>
                            <option>Housekeeping Staff</option>
                            <option>Sweeper</option>
                            <option>Cleaner</option>
                            <option>Security Guard</option>
                            <option>Gardener</option>
                            <option>Electrician</option>
                            <option>Plumber</option>
                            <option>Carpenter</option>
                            <option>Maintenance Worker</option>
                            <option>Waterman</option>
                        </optgroup>

                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group" id="otherRoleGroup" hidden>
                    <label>Enter Other Job Role <span>*</span></label>
                    <input type="text" id="otherDesignation"
                           name="other_designation"
                           placeholder="Type job designation">
                </div>

                <div class="form-group">
                    <label>Department <span>*</span></label>

                    <select name="department" required>
                        <option value="">Select Department</option>
                        <option>Administration</option>
                        <option>Transport</option>
                        <option>Finance & Accounts</option>
                        <option>Library</option>
                        <option>Laboratory</option>
                        <option>Support & Maintenance</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Joining Date <span>*</span></label>
                    <input type="text" name="joining_date"
                           class="date-input"
                           placeholder="DD-MM-YYYY"
                           maxlength="10"
                           inputmode="numeric"
                           autocomplete="off"
                           required>
                </div>

                <div class="form-group">
                    <label>Employment Type <span>*</span></label>
                    <select name="employment_type" required>
                        <option value="">Select Employment Type</option>
                        <option>Permanent</option>
                        <option>Contract</option>
                        <option>Temporary</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Monthly Salary (₹)</label>
                    <input type="number" name="salary"
                           min="0" step="0.01"
                           placeholder="Enter monthly salary">
                </div>

            </div>
        </section>


        <!-- ADDITIONAL INFORMATION -->

        <section class="form-section">

            <div class="section-heading">
                <div class="section-icon">03</div>
                <div>
                    <h3>Additional Information</h3>
                    <p>Emergency contact information</p>
                </div>
            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label>Emergency Contact Name</label>
                    <input type="text" name="emergency_name"
                           placeholder="Enter contact person's name">
                </div>

                <div class="form-group">
                    <label>Emergency Contact Number</label>
                    <input type="tel" name="emergency_phone"
                           placeholder="Enter contact number"
                           pattern="[6-9][0-9]{9}"
                           maxlength="10">
                </div>

            </div>
        </section>


        <!-- FORM ACTIONS -->

        <div class="form-actions">

            <button type="reset" class="reset-btn">
                Reset Form
            </button>

            <button type="submit" class="submit-btn">
                Register Staff →
            </button>

        </div>

    </form>

</div>

<script src="../js/non_teaching_staff_form.js"></script>

</body>
</html>
