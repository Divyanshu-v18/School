<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Add a new student to ABC Public School's management system.">


    <title>Add Student</title>

    <!-- COMMON CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

    <!-- STUDENT PAGE CSS -->
    <link rel="stylesheet" href="../css/student.css">

</head>


<body class="add_student-page">

    <main class="add_student-wrap">

        <!-- ================= ADD STUDENT FORM ================= -->

        <section class="add_student-section" id="addStudentSection">

            <!-- FORM HEADER -->

            <div class="form-header">

                <div>

                    <h2>Add Student</h2>

                    <p>Enter the student's details below</p>

                </div>

                <button
                    type="button"
                    class="close-form-btn"
                    id="closeStudentForm"
                >
                    ×
                </button>

            </div>


            <form id="studentForm">

                <!-- ================= BASIC DETAILS ================= -->

                <div class="form-section">

                    <h3>Basic Details</h3>

                    <div class="form-grid">

                        <div class="form-group">

                            <label for="fullName">
                                Full Name <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="fullName"
                                name="fullName"
                                placeholder="Enter full name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="dateOfBirth">
                                Date of Birth <span>*</span>
                            </label>

                            <input
                                type="date"
                                id="dateOfBirth"
                                name="dateOfBirth"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="gender">
                                Gender <span>*</span>
                            </label>

                            <select
                                id="gender"
                                name="gender"
                                required
                            >

                                <option value="">
                                    Select Gender
                                </option>

                                <option value="Male">
                                    Male
                                </option>

                                <option value="Female">
                                    Female
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="category">
                                Category <span>*</span>
                            </label>

                            <select
                                id="category"
                                name="category"
                                required
                            >

                                <option value="">
                                    Select Category
                                </option>

                                <option value="General">
                                    General
                                </option>

                                <option value="EWS">
                                    EWS
                                </option>

                                <option value="OBC">
                                    OBC
                                </option>

                                <option value="SC">
                                    SC
                                </option>

                                <option value="ST">
                                    ST
                                </option>

                                <option value="Others">
                                    Others
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="bloodGroup">
                                Blood Group <span>*</span>
                            </label>

                            <select
                                id="bloodGroup"
                                name="bloodGroup"
                                required
                            >

                                <option value="">
                                    Select Blood Group
                                </option>

                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>

                            </select>

                        </div>

                    </div>

                </div>


                <!-- ================= ADMISSION & SCHOOL DETAILS ================= -->

                <div class="form-section">

                    <h3>Admission & School Details</h3>

                    <div class="form-grid">

                        <div class="form-group">

                            <label for="admissionDate">
                                Admission Date <span>*</span>
                            </label>

                            <input
                                type="date"
                                id="admissionDate"
                                name="admissionDate"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="admissionNo">
                                Admission No <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="admissionNo"
                                name="admissionNo"
                                placeholder="Enter admission number"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="aadharLastFour">
                                Aadhaar Last 4 Digits <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="aadharLastFour"
                                name="aadharLastFour"
                                placeholder="Enter last 4 digits"
                                maxlength="4"
                                inputmode="numeric"
                                pattern="[0-9]{4}"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="apaarNo">
                                APAAR No <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="apaarNo"
                                name="apaarNo"
                                placeholder="Enter APAAR number"
                                maxlength="12"
                                inputmode="numeric"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="penNo">
                                PEN No <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="penNo"
                                name="penNo"
                                placeholder="Enter PEN number"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="bpl">
                                BPL <span>*</span>
                            </label>

                            <select
                                id="bpl"
                                name="bpl"
                                required
                            >

                                <option value="">
                                    Select
                                </option>

                                <option value="YES">
                                    YES
                                </option>

                                <option value="NO">
                                    NO
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="class">
                                Class
                            </label>

                            <select id="class" name="class">

                                <option value="">
                                    Select Class
                                </option>

                                <option value="KIDSCARE">KidsCare</option>
                                <option value="NUR">NUR</option>
                                <option value="LKG">LKG</option>
                                <option value="UKG">UKG</option>
                                <option value="1">Class 1</option>
                                <option value="2">Class 2</option>
                                <option value="3">Class 3</option>
                                <option value="4">Class 4</option>
                                <option value="5">Class 5</option>
                                <option value="6">Class 6</option>
                                <option value="7">Class 7</option>
                                <option value="8">Class 8</option>
                                <option value="9">Class 9</option>
                                <option value="10">Class 10</option>
                                <option value="11">Class 11</option>
                                <option value="12">Class 12</option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="section">
                                Section
                            </label>

                            <select id="section" name="section">

                                <option value="">
                                    Select Section
                                </option>

                                <option value="A">Section A</option>
                                <option value="B">Section B</option>
                                <option value="C">Section C</option>
                                <option value="D">Section D</option>

                            </select>

                        </div>

                        <div class="form-group">

                            <label for="transport">
                                Transportation <span>*</span>
                            </label>

                            <select
                                id="transport"
                                name="transport"
                                required
                            >

                                <option value="">
                                    Select
                                </option>

                                <option value="YES">
                                    YES
                                </option>

                                <option value="NO">
                                    NO
                                </option>

                            </select>

                        </div>

                    </div>

                </div>


                <!-- ================= FATHER DETAILS ================= -->

                <div class="form-section">

                    <h3>Father Details</h3>

                    <div class="form-grid">

                        <div class="form-group">

                            <label for="fatherName">
                                Father's Name <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="fatherName"
                                name="fatherName"
                                placeholder="Enter father's name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="fatherAadharLastFour">
                                Father's Aadhaar Last 4 Digits <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="fatherAadharLastFour"
                                name="fatherAadharLastFour"
                                placeholder="Enter last 4 digits"
                                maxlength="4"
                                inputmode="numeric"
                                pattern="[0-9]{4}"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="fatherPhone">
                                Father's Phone
                            </label>

                            <input
                                type="tel"
                                id="fatherPhone"
                                name="fatherPhone"
                                placeholder="Enter phone number"
                                maxlength="10"
                                inputmode="numeric"
                            >

                        </div>

                    </div>

                </div>


                <!-- ================= MOTHER DETAILS ================= -->

                <div class="form-section">

                    <h3>Mother Details</h3>

                    <div class="form-grid">

                        <div class="form-group">

                            <label for="motherName">
                                Mother's Name <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="motherName"
                                name="motherName"
                                placeholder="Enter mother's name"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="motherAadharLastFour">
                                Mother's Aadhaar Last 4 Digits <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="motherAadharLastFour"
                                name="motherAadharLastFour"
                                placeholder="Enter last 4 digits"
                                maxlength="4"
                                inputmode="numeric"
                                pattern="[0-9]{4}"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="motherPhone">
                                Mother's Phone
                            </label>

                            <input
                                type="tel"
                                id="motherPhone"
                                name="motherPhone"
                                placeholder="Enter phone number"
                                maxlength="10"
                                inputmode="numeric"
                            >

                        </div>

                    </div>

                </div>


                <!-- ================= ADDRESS DETAILS ================= -->

                <div class="form-section">

                    <h3>Address Details</h3>

                    <div class="form-grid">

                        <div class="form-group">

                            <label for="houseNo">
                                House No
                            </label>

                            <input
                                type="text"
                                id="houseNo"
                                name="houseNo"
                                placeholder="Enter house number"
                            >

                        </div>


                        <div class="form-group">

                            <label for="street">
                                Street <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="street"
                                name="street"
                                placeholder="Enter street"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="city">
                                City <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="city"
                                name="city"
                                placeholder="Enter city"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="state">
                                State <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="state"
                                name="state"
                                placeholder="Enter state"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="pincode">
                                Pincode <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="pincode"
                                name="pincode"
                                placeholder="Enter pincode"
                                maxlength="6"
                                inputmode="numeric"
                                pattern="[0-9]{6}"
                                required
                            >

                        </div>

                    </div>

                </div>


                <!-- ================= FORM ACTIONS ================= -->

                <div class="form-actions">

                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelStudentForm"
                    >
                        Cancel
                    </button>


                    <button
                        type="submit"
                        class="save-student-btn"
                    >
                        Add Student
                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="../js/sidebar.js"></script>
    <script src="../js/feature-toggle.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/add_student.js"></script>

</body>

</html>
