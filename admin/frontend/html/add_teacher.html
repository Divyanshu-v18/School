<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Add a new teacher to ABC Public School's staff directory.">


    <title>Add Teacher</title>

    <!-- COMMON CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

    <!-- TEACHER PAGE CSS -->
    <link rel="stylesheet" href="../css/teacher.css">
</head>

<body class="add_teacher-page">

    <main class="add_teacher-wrap">

        <!-- ================= ADD TEACHER FORM ================= -->

        <section
                    class="add_teacher-section"
                    id="addTeacherSection"
                >

                    <!-- Form Header -->

                    <div class="form-header">

                        <div>
                            <h2>Add Teacher</h2>
                            <p>Enter the teacher's details below</p>
                        </div>

                        <button
                            type="button"
                            class="close-form-btn"
                            id="closeTeacherForm"
                        >
                            ×
                        </button>

                    </div>


                    <form id="teacherForm">

                        <!-- ================= BASIC DETAILS ================= -->

                        <div class="form-section">

                            <h3>Basic Details</h3>

                            <div class="form-grid">

                                <div class="form-group">

                                    <label for="fullName">
                                        Full Name <span>*</span>
                                    </label>

                                    <input
                                        type="text"
                                        id="fullName"
                                        name="fullName"
                                        placeholder="Enter full name"
                                        maxlength="60"
                                        required
                                    >

                                </div>


                                <div class="form-group">

                                    <label for="dateOfBirth">
                                        Date of Birth <span>*</span>
                                    </label>

                                    <input
                                        type="date"
                                        id="dateOfBirth"
                                        name="dateOfBirth"
                                        required
                                    >

                                </div>


                                <div class="form-group">

                                    <label for="gender">
                                        Gender <span>*</span>
                                    </label>

                                    <select
                                        id="gender"
                                        name="gender"
                                        required
                                    >
                                        <option value="">
                                            Select Gender
                                        </option>

                                        <option value="Male">
                                            Male
                                        </option>

                                        <option value="Female">
                                            Female
                                        </option>

                                        <option value="Other">
                                            Other
                                        </option>

                                    </select>

                                </div>


                                <div class="form-group">

                                    <label for="category">
                                        Category <span>*</span>
                                    </label>

                                    <select
                                        id="category"
                                        name="category"
                                        required
                                    >
                                        <option value="">
                                            Select Category
                                        </option>

                                        <option value="General">
                                            General
                                        </option>

                                        <option value="EWS">
                                            EWS
                                        </option>

                                        <option value="OBC">
                                            OBC
                                        </option>

                                        <option value="SC">
                                            SC
                                        </option>

                                        <option value="ST">
                                            ST
                                        </option>

                                        <option value="Others">
                                            Others
                                        </option>

                                    </select>

                                </div>


                                <div class="form-group">

                                    <label for="bloodGroup">
                                        Blood Group <span>*</span>
                                    </label>

                                    <select
                                        id="bloodGroup"
                                        name="bloodGroup"
                                        required
                                    >
                                        <option value="">
                                            Select Blood Group
                                        </option>

                                        <option value="A+">A+</option>
                                        <option value="A-">A-</option>
                                        <option value="B+">B+</option>
                                        <option value="B-">B-</option>
                                        <option value="AB+">AB+</option>
                                        <option value="AB-">AB-</option>
                                        <option value="O+">O+</option>
                                        <option value="O-">O-</option>

                                    </select>

                                </div>


                                <div class="form-group">

                                    <label for="phone">
                                        Phone <span>*</span>
                                    </label>

                                    <input
                                        type="tel"
                                        id="phone"
                                        name="phone"
                                        placeholder="Enter phone number"
                                        maxlength="10"
                                        pattern="[0-9]{10}"
                                        required
                                    >

                                </div>


                                <div class="form-group">

                                    <label for="email">
                                        Email <span>*</span>
                                    </label>

                                    <input
                                        type="email"
                                        id="email"
                                        name="email"
                                        placeholder="Enter email address"
                                        maxlength="100"
                                        required
                                    >

                                </div>

                            </div>

                        </div>


                        <!-- ================= ADDRESS DETAILS ================= -->

                        <div class="form-section">

                            <h3>Address Details</h3>

                            <div class="form-grid">

                                <div class="form-group">

                                    <label for="houseNo">
                                        House No.
                                    </label>

                                    <input
                                        type="text"
                                        id="houseNo"
                                        name="houseNo"
                                        placeholder="Enter house number"
                                        maxlength="10"
                                    >

                                </div>


                                <div class="form-group">

                                    <label for="street">
                                        Street <span>*</span>
                                    </label>

                                    <input
                                        type="text"
                                        id="street"
                                        name="street"
                                        placeholder="Enter street"
                                        maxlength="200"
                                        required
                                    >

                                </div>


                                <div class="form-group">

                                    <label for="city">
                                        City <span>*</span>
                                    </label>

                                    <input
                                        type="text"
                                        id="city"
                                        name="city"
                                        placeholder="Enter city"
                                        maxlength="50"
                                        required
                                    >

                                </div>


                                <div class="form-group">

                                    <label for="state">
                                        State <span>*</span>
                                    </label>

                                    <input
                                        type="text"
                                        id="state"
                                        name="state"
                                        placeholder="Enter state"
                                        maxlength="50"
                                        required
                                    >

                                </div>


                                <div class="form-group">

                                    <label for="pincode">
                                        Pincode <span>*</span>
                                    </label>

                                    <input
                                        type="text"
                                        id="pincode"
                                        name="pincode"
                                        placeholder="Enter pincode"
                                        maxlength="6"
                                        pattern="[0-9]{6}"
                                        required
                                    >

                                </div>

                            </div>

                        </div>


                        <!-- ================= PROFESSIONAL DETAILS ================= -->

                        <div class="form-section">

                            <h3>Professional Details</h3>

                            <div class="form-grid">

                                <div class="form-group">

                                    <label for="dateOfJoining">
                                        Date of Joining <span>*</span>
                                    </label>

                                    <input
                                        type="date"
                                        id="dateOfJoining"
                                        name="dateOfJoining"
                                        required
                                    >

                                </div>


                                <div class="form-group">

                                    <label for="joiningNo">
                                        Joining No.
                                    </label>

                                    <input
                                        type="text"
                                        id="joiningNo"
                                        name="joiningNo"
                                        placeholder="Enter joining number"
                                        maxlength="20"
                                    >

                                </div>


                                <div class="form-group">

                                    <label for="aadharNo">
                                        Aadhar No. <span>*</span>
                                    </label>

                                    <input
                                        type="text"
                                        id="aadharNo"
                                        name="aadharNo"
                                        placeholder="Enter 12-digit Aadhar number"
                                        maxlength="12"
                                        pattern="[0-9]{12}"
                                        required
                                    >

                                </div>


                                <div class="form-group">

                                    <label for="qualification">
                                        Qualification <span>*</span>
                                    </label>

                                    <input
                                        type="text"
                                        id="qualification"
                                        name="qualification"
                                        placeholder="Enter qualification"
                                        maxlength="30"
                                        required
                                    >

                                </div>


                                <div class="form-group">

                                    <label for="post">
                                        Post <span>*</span>
                                    </label>

                                    <input
                                        type="text"
                                        id="post"
                                        name="post"
                                        placeholder="Enter post"
                                        maxlength="50"
                                        required
                                    >

                                </div>


                                <div class="form-group">

                                    <label for="cl">
                                        CL <span>*</span>
                                    </label>

                                    <input
                                        type="number"
                                        id="cl"
                                        name="cl"
                                        placeholder="Enter number of leave days"
                                        min="0"
                                        required
                                    >

                                </div>

                            </div>

                        </div>


                        <!-- ================= FORM ACTIONS ================= -->

                        <div class="form-actions">

                            <button
                                type="button"
                                class="cancel-btn"
                                id="cancelTeacherForm"
                            >
                                Cancel
                            </button>

                            <button
                                type="submit"
                                class="submit-teacher-btn"
                            >
                                Add Teacher
                            </button>

                        </div>

                    </form>

                </section>

    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="../js/sidebar.js"></script>
    <script src="../js/feature-toggle.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/add_teacher.js"></script>

</body>

</html>
