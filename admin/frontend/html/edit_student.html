<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Edit an existing student's details in the school management system.">


    <title>Edit Student</title>

    <!-- COMMON CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

    <!-- SAME CSS AS TEACHER PAGES (gives identical look) -->
    <link rel="stylesheet" href="../css/teacher.css">

    <!-- SMALL STUDENT-ONLY ADDITIONS -->
    <link rel="stylesheet" href="../css/edit_student.css">
</head>

<body class="add_teacher-page">

    <main class="add_teacher-wrap">

        <section class="add_teacher-section" id="addTeacherSection">

            <!-- Form Header -->

            <div class="form-header">

                <div>
                    <h2>Edit Student</h2>
                    <p>Edit the student's details below</p>
                </div>

                <button type="button" class="close-form-btn" id="closeStudentForm">
                    ×
                </button>

            </div>


            <form id="studentForm">

                <!-- ================= BASIC DETAILS ================= -->

                <div class="form-section">

                    <h3>Basic Details</h3>

                    <div class="form-grid">

                        <div class="form-group">
                            <label for="fullName">Full Name <span>*</span></label>
                            <input type="text" id="fullName" name="fullName" maxlength="60" required>
                        </div>

                        <div class="form-group">
                            <label for="dateOfBirth">Date of Birth <span>*</span></label>
                            <input type="date" id="dateOfBirth" name="dateOfBirth" required>
                        </div>

                        <div class="form-group">
                            <label for="gender">Gender <span>*</span></label>
                            <select id="gender" name="gender" required>
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="category">Category <span>*</span></label>
                            <select id="category" name="category" required>
                                <option value="">Select Category</option>
                                <option value="General">General</option>
                                <option value="EWS">EWS</option>
                                <option value="OBC">OBC</option>
                                <option value="SC">SC</option>
                                <option value="ST">ST</option>
                                <option value="Others">Others</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="bloodGroup">Blood Group <span>*</span></label>
                            <select id="bloodGroup" name="bloodGroup" required>
                                <option value="">Select Blood Group</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                            </select>
                        </div>

                    </div>

                </div>

                <!-- ================= ADMISSION & SCHOOL DETAILS ================= -->

                <div class="form-section">

                    <h3>Admission &amp; School Details</h3>

                    <div class="form-grid">

                        <div class="form-group">
                            <label for="admissionDate">Admission Date <span>*</span></label>
                            <input type="date" id="admissionDate" name="admissionDate" required>
                        </div>

                        <div class="form-group">
                            <label for="admissionNo">Admission No. <span>*</span></label>
                            <input type="text" id="admissionNo" name="admissionNo" maxlength="20" required>
                        </div>

                        <div class="form-group">
                            <label for="aadharLastFour">Aadhar Last Four <span>*</span></label>
                            <input type="text" id="aadharLastFour" name="aadharLastFour"
                                   maxlength="4" pattern="[0-9]{4}" required>
                        </div>

                        <div class="form-group">
                            <label for="apaarNo">APAAR No. <span>*</span></label>
                            <input type="text" id="apaarNo" name="apaarNo"
                                   maxlength="12" pattern="[0-9]{12}" required>
                        </div>

                        <div class="form-group">
                            <label for="penNo">PEN No. <span>*</span></label>
                            <input type="text" id="penNo" name="penNo" maxlength="20" required>
                        </div>

                        <div class="form-group">
                            <label for="bpl">BPL <span>*</span></label>
                            <select id="bpl" name="bpl" required>
                                <option value="">Select</option>
                                <option value="YES">YES</option>
                                <option value="NO">NO</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="className">Class</label>
                            <select id="className" name="className">
                                <option value="">Select Class</option>
                                <option value="KIDSCARE">KidsCare</option>
                                <option value="NUR">NUR</option>
                                <option value="LKG">LKG</option>
                                <option value="UKG">UKG</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                                <option value="11">11</option>
                                <option value="12">12</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="section">Section</label>
                            <select id="section" name="section">
                                <option value="">Select Section</option>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="transport">Transportation<span>*</span></label>
                            <select id="transport" name="transport" required>
                                <option value="">Select</option>
                                <option value="YES">YES</option>
                                <option value="NO">NO</option>
                            </select>
                        </div>

                    </div>

                </div>


                <!-- ================= FATHER DETAILS ================= -->

                <div class="form-section">

                    <h3>Father Details</h3>

                    <div class="form-grid">

                        <div class="form-group">
                            <label for="fatherName">Father Name <span>*</span></label>
                            <input type="text" id="fatherName" name="fatherName" maxlength="60" required>
                        </div>

                        <div class="form-group">
                            <label for="fatherAadhar">Father Aadhar Last Four <span>*</span></label>
                            <input type="text" id="fatherAadhar" name="fatherAadhar"
                                   maxlength="4" pattern="[0-9]{4}" required>
                        </div>

                        <div class="form-group">
                            <label for="fatherPhone">Father Phone</label>
                            <input type="tel" id="fatherPhone" name="fatherPhone"
                                   maxlength="10" pattern="[0-9]{10}">
                        </div>

                    </div>

                </div>


                <!-- ================= MOTHER DETAILS ================= -->

                <div class="form-section">

                    <h3>Mother Details</h3>

                    <div class="form-grid">

                        <div class="form-group">
                            <label for="motherName">Mother Name <span>*</span></label>
                            <input type="text" id="motherName" name="motherName" maxlength="60" required>
                        </div>

                        <div class="form-group">
                            <label for="motherAadhar">Mother Aadhar Last Four <span>*</span></label>
                            <input type="text" id="motherAadhar" name="motherAadhar"
                                   maxlength="4" pattern="[0-9]{4}" required>
                        </div>

                        <div class="form-group">
                            <label for="motherPhone">Mother Phone</label>
                            <input type="tel" id="motherPhone" name="motherPhone"
                                   maxlength="10" pattern="[0-9]{10}">
                        </div>

                    </div>

                </div>

                <!-- ================= ADDRESS DETAILS ================= -->

                <div class="form-section">

                    <h3>Address Details</h3>

                    <div class="form-grid">

                        <div class="form-group">
                            <label for="houseNo">House No.</label>
                            <input type="text" id="houseNo" name="houseNo" maxlength="10">
                        </div>

                        <div class="form-group">
                            <label for="street">Street <span>*</span></label>
                            <input type="text" id="street" name="street" maxlength="200" required>
                        </div>

                        <div class="form-group">
                            <label for="city">City <span>*</span></label>
                            <input type="text" id="city" name="city" maxlength="50" required>
                        </div>

                        <div class="form-group">
                            <label for="state">State <span>*</span></label>
                            <input type="text" id="state" name="state" maxlength="50" required>
                        </div>

                        <div class="form-group">
                            <label for="pincode">Pincode <span>*</span></label>
                            <input type="text" id="pincode" name="pincode" maxlength="6"
                                   pattern="[0-9]{6}" required>
                        </div>

                    </div>

                </div>


                <!-- ================= FORM ACTIONS ================= -->

                <div class="form-actions">

                    <button type="button" class="cancel-btn" id="cancelStudentForm">
                        Cancel
                    </button>

                    <button type="submit" class="submit-teacher-btn">
                        Save Changes
                    </button>

                </div>

            </form>

        </section>

    </main>

    <!-- ================= JAVASCRIPT ================= -->

    <script src="../js/sidebar.js"></script>
    <script src="../js/feature-toggle.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/edit_student.js"></script>

</body>

</html>
